name: CI
on:
  push:
    branches:
      - main
    tags:
      - "*-v*"
    paths:
      - ".github/workflows/**"
      - "lib/**"
      - "src/**"
      - "test/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "lib/**"
      - "src/**"
      - "test/**"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Amber
        uses: lens0021/setup-amber@385b135a8646e1bf684d6b6e209ea0bdc8f99740 # v2
        with:
          amber-version: 0.6.0-alpha

      - run: npm install -g @devcontainers/cli
        name: Install devcontainer CLI

      # Note: "find -exec ... \;" would ignore failures, so loop explicitly
      - name: Check Amber library
        run: |
          for file in $(find ./lib -name "*.ab"); do
            echo "$file"
            amber check "$file"
          done

      - name: Build Amber feature install scripts
        run: |
          for file in $(find ./src -name "install.ab"); do
            echo "$file"
            amber build "$file"
          done

      - name: Generate documentation
        run: |
          (cd ./src && devcontainer features generate-docs -n "NicoVIII/devcontainer-features")

      - name: Check for repository changes
        run: |
          if [ -z "$(git status --porcelain=v1)" ]; then
            echo "Generated documentation and Amber artifacts are up to date."
          else
            echo "Changes detected after Amber checks/builds or documentation generation:"
            git status --porcelain=v1
            echo "Please run Amber validation/build and documentation generation locally, then commit the changes."
            exit 1
          fi

  detect-changes:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      amber_changed: ${{ steps.filter.outputs.amber }}
      claude_mount_changed: ${{ steps.filter.outputs.claude_mount }}
      gleam_changed: ${{ steps.filter.outputs.gleam }}
      just_changed: ${{ steps.filter.outputs.just }}
      lefthook_changed: ${{ steps.filter.outputs.lefthook }}
      oxlint_changed: ${{ steps.filter.outputs.oxlint }}
      roc_changed: ${{ steps.filter.outputs.roc }}
      scrut_changed: ${{ steps.filter.outputs.scrut }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            amber:
              - '.github/workflows/**'
              - 'lib/**'
              - 'src/amber/**'
              - 'test/amber/**'
            claude_mount:
              - '.github/workflows/**'
              - 'lib/**'
              - 'src/claude-mount/**'
              - 'test/claude-mount/**'
            gleam:
              - '.github/workflows/**'
              - 'lib/**'
              - 'src/gleam/**'
              - 'test/gleam/**'
            just:
              - '.github/workflows/**'
              - 'lib/**'
              - 'src/just/**'
              - 'test/just/**'
            lefthook:
              - '.github/workflows/**'
              - 'lib/**'
              - 'src/lefthook/**'
              - 'test/lefthook/**'
            oxlint:
              - '.github/workflows/**'
              - 'lib/**'
              - 'src/oxlint/**'
              - 'test/oxlint/**'
            roc:
              - '.github/workflows/**'
              - 'lib/**'
              - 'src/roc/**'
              - 'test/roc/**'
            scrut:
              - '.github/workflows/**'
              - 'lib/**'
              - 'src/scrut/**'
              - 'test/scrut/**'

  # The write permissions below are only a ceiling for the called workflow: its test job drops
  # to read-only, and only its tag-gated publish job uses them.
  amber:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.amber_changed == 'true' || startsWith(github.ref, 'refs/tags/amber-v') }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/reusable-feature.yml
    with:
      feature_name: "amber"

  claude-mount:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.claude_mount_changed == 'true' || startsWith(github.ref, 'refs/tags/claude-mount-v') }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/reusable-feature.yml
    with:
      feature_name: "claude-mount"

  gleam:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.gleam_changed == 'true' || startsWith(github.ref, 'refs/tags/gleam-v') }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/reusable-feature.yml
    with:
      feature_name: "gleam"

  just:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.just_changed == 'true' || startsWith(github.ref, 'refs/tags/just-v') }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/reusable-feature.yml
    with:
      feature_name: "just"

  lefthook:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.lefthook_changed == 'true' || startsWith(github.ref, 'refs/tags/lefthook-v') }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/reusable-feature.yml
    with:
      feature_name: "lefthook"

  oxlint:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.oxlint_changed == 'true' || startsWith(github.ref, 'refs/tags/oxlint-v') }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/reusable-feature.yml
    with:
      feature_name: "oxlint"

  roc:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.roc_changed == 'true' || startsWith(github.ref, 'refs/tags/roc-v') }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/reusable-feature.yml
    with:
      feature_name: "roc"

  scrut:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.scrut_changed == 'true' || startsWith(github.ref, 'refs/tags/scrut-v') }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/reusable-feature.yml
    with:
      feature_name: "scrut"
