name: Reusable Feature
on:
  workflow_call:
    inputs:
      feature_name:
        description: Name of the feature
        required: true
        type: string
# Granted per job: the tests run freshly downloaded third-party binaries and must not hold a
# token that can publish.
permissions: {}
env:
  FEATURE: ${{ inputs.feature_name }}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: npm install -g @devcontainers/cli
        name: Install devcontainer CLI

      # claude-mount bind-mounts $HOME/.claude; docker's --mount errors if the source path is
      # missing, so create it on the runner (real users already have this directory).
      - run: mkdir -p "$HOME/.claude"
        name: Ensure claude-mount source exists
        if: inputs.feature_name == 'claude-mount'

      - run: devcontainer features test --skip-autogenerated -f "$FEATURE"
        name: Run tests

  publish:
    needs: test
    if: startsWith(github.ref, format('refs/tags/{0}-v', inputs.feature_name))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: npm install -g @devcontainers/cli
        name: Install devcontainer CLI

      # "features publish" takes the version from devcontainer-feature.json, not from the tag:
      # without this check a forgotten bump creates a release for a version that was never published.
      - name: Extract and check release version
        id: release_version
        run: |
          version="${GITHUB_REF_NAME#"$FEATURE"-v}"
          declared="$(jq -r .version "./src/$FEATURE/devcontainer-feature.json")"
          if [ "$version" != "$declared" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $declared in src/$FEATURE/devcontainer-feature.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        id: changelog_reader
        with:
          path: ./src/${{ inputs.feature_name }}/CHANGELOG.md
          version: ${{ steps.release_version.outputs.version }}

      - run: devcontainer features publish -n nicoviii/devcontainer-features "./src/$FEATURE"
        name: Publish feature
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body: ${{ steps.changelog_reader.outputs.changes }}
          prerelease: ${{ steps.changelog_reader.outputs.status == 'unreleased' }}
